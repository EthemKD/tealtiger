[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tealtiger-mcp"
version = "1.0.0"
description = "MCP server exposing TealTiger guardrails, cost tracking, and budget enforcement as tools for Claude and other MCP clients."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "TealTiger", email = "reachout@tealtiger.ai" },
]
keywords = ["mcp", "tealtiger", "guardrails", "ai-security", "cost-tracking", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tealtiger>=1.4.0",
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://tealtiger.ai"
Documentation = "https://docs.tealtiger.ai"
Repository = "https://github.com/agentguard-ai/tealtiger"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
tealtiger-mcp = "tealtiger_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tealtiger_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
